name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-validation:
    name: Workflow and shell validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-verified actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$ARCHIVE"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$ARCHIVE" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate workflows and shell scripts
        run: ./scripts/lint-ci.sh

  source-tests:
    name: Xcode 27 source tests
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the hosted Xcode 27 ARM64 image
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -q '^Xcode 27\.'
          swift --version | grep -q 'Swift version 6\.4'
          test "$(uname -m)" = arm64

      - name: Test with complete concurrency checking
        run: >-
          swift test --package-path Packages/DACDevices
          --scratch-path .build/package
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors

      - name: Build package libraries with complete concurrency checking
        run: >-
          swift build --package-path Packages/DACDevices
          --scratch-path .build/package
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors

      - name: Test the Xcode app
        run: >-
          xcodebuild -quiet
          -project DACBar.xcodeproj
          -scheme DACBar
          -disableAutomaticPackageResolution
          -configuration Debug
          -derivedDataPath .build/ci-tests
          -destination "platform=macOS,arch=arm64"
          test

  universal-app:
    name: Universal 2 app and DMG
    needs: source-tests
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the hosted Xcode 27 ARM64 image
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -q '^Xcode 27\.'
          swift --version | grep -q 'Swift version 6\.4'
          test "$(uname -m)" = arm64

      - name: Build and validate Universal 2 app
        env:
          DACBAR_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./build.sh release
          ./scripts/validate-app.sh dist/DACBar.app
          ./scripts/smoke-launch-app.sh dist/DACBar.app
          ./scripts/create-dmg.sh dist/DACBar.app dist/DACBar-ci.dmg "DACBar CI"
          codesign --force --sign - --timestamp=none dist/DACBar-ci.dmg
          ./scripts/validate-dmg.sh dist/DACBar-ci.dmg

      - name: Upload validated DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DACBar-universal-${{ github.sha }}
          path: dist/DACBar-ci.dmg
          if-no-files-found: error
          retention-days: 7

  intel-smoke:
    name: Intel launch smoke
    needs: universal-app
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the hosted Intel image
        run: test "$(uname -m)" = x86_64

      - name: Download the exact Universal 2 DMG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DACBar-universal-${{ github.sha }}
          path: dist

      - name: Launch the Intel slice
        # The upstream job already performs the complete bundle, signature,
        # architecture, and DMG validation before uploading this exact artifact.
        # Keep this runner focused on the one property only Intel can prove:
        # that the x86_64 slice launches successfully.
        run: ./scripts/smoke-launch-dmg.sh dist/DACBar-ci.dmg
